name: Tests

# The fleet CI floor (decision 5, C4-tests-yml), on the shape ported from
# jeles and trimmed to what this repo has. Five legs and one gate:
#
#   test-matrix  Linux, one job per Python this package declares support for.
#                The list is DERIVED from pyproject.toml's
#                `Programming Language :: Python :: 3.X` classifiers, every
#                listed minor, and tests/test_release_wiring.py holds the two
#                equal — a classifier that CI never runs is a promise nobody
#                checked, and a matrix entry with no classifier is a version
#                the package does not claim.
#   windows      The same suite on the floor and the ceiling Python only. The
#                point is the path lessons (separators, line endings, what a
#                byte-hash reads), not a second full matrix.
#   no-extras    The base install with nothing but pytest and pyyaml, proving
#                the package is dependency-free and degrades honestly without
#                Nestor or fsrs.
#   lint         `ruff check` + `ruff format --check`, ruff pinned to one exact
#                version so a ruff release cannot redden every PR at once. The
#                pin is held by tests/test_release_wiring.py; bump it on
#                purpose, in its own commit.
#   test         The aggregate branch protection requires. It `needs:` every
#                leg, runs `if: always()`, and fails unless EVERY needed
#                result is `success` — a skipped or cancelled leg is a failure,
#                because "did not run" is not "passed" and a required check
#                that goes green on a skipped job protects nothing. With
#                nothing required, GitHub will not arm auto-merge on the
#                release PR at all.
#
# Two things this suite needs to be honest about:
#   * Nestor. The checkpoint tests seal decisions; with the fleet's per-verifier
#     keyring in the environment they would correctly be refused (a synthetic
#     verifier has no key). CI has no keyring, so nothing to unset here — but
#     never export NESTOR_KEYRING into this job.
#   * The soft dependencies. codebase-memory-mcp is not installed here; its
#     tests skip or degrade, and the no-extras leg proves the base install
#     runs with nothing at all.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # == the `Programming Language :: Python :: 3.X` classifiers in
        # pyproject.toml, every listed minor; held equal by
        # tests/test_release_wiring.py::test_the_linux_matrix_is_the_classifiers.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from tags; a shallow checkout has none.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with the test extra
        run: pip install -e ".[test]"
      - name: Vendored bodies still hash to what tools/vendor_manifest.json pins
        # stdlib only; names every drift and how to resolve it (re-sync from
        # the origin, or `--print` and record the decision in the manifest).
        run: python tools/vendor_sync_check.py
      - name: Run tests
        run: python -m pytest tests/ -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the classifier list, nothing between.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with the test extra
        run: pip install -e ".[test]"
      - name: Vendored bodies still hash to what tools/vendor_manifest.json pins
        run: python tools/vendor_sync_check.py
      - name: Run tests
        run: python -m pytest tests/ -q

  no-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with no extras
        run: pip install -e . pytest pyyaml
      - name: Assert the base install is dependency-free and Nestor is absent
        run: |
          python - <<'PY'
          import importlib.util
          from importlib.metadata import requires
          declared = [r for r in (requires("forge-play") or []) if "extra ==" not in r]
          assert not declared, f"base forge-play declared runtime deps: {declared}"
          assert importlib.util.find_spec("nestor") is None, (
              "nestor is installed in the no-extras job, so this leg is not "
              "actually testing the soft-Nestor path"
          )
          assert importlib.util.find_spec("willow_mcp") is None, (
              "willow_mcp is installed here; the engine must never depend on it"
          )
          print("base install is dependency-free; nestor and willow_mcp are absent")
          PY
      - name: Run tests without Nestor (soft-dependency path)
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff, pinned
        # An exact pin, on purpose: a ruff release that adds a rule must not
        # redden every open PR at once. Bump it in its own commit; the pin is
        # held by tests/test_release_wiring.py::test_ruff_is_pinned_to_an_exact_version.
        run: pip install ruff==0.16.7
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    needs: [test-matrix, windows, no-extras, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job must have succeeded (skipped and cancelled are failures)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {job: info.get("result") for job, info in needs.items()
                 if info.get("result") != "success"}
          for job, result in needs.items():
              print(f"{job}={result.get('result')}")
          if bad:
              print(f"::error::a required job did not succeed: {bad} "
                    "(skipped and cancelled count as failures — a job that did "
                    "not run did not pass)")
              sys.exit(1)
          print("every leg succeeded")
          PY
